submit_now:
  name: Отправить показания сейчас
  description: >-
    Немедленно отправить текущие показания счётчиков на mos.ru. Если показания за
    период уже внесены на портале, отправка не выполняется (портал их не
    перезаписывает) — для замены используйте «Перезаписать показания».

replace_readings:
  name: Перезаписать показания
  description: >-
    Удалить последние показания счётчиков на портале и отправить текущие. Нужно,
    когда за период уже внесено значение: обычная отправка его не заменяет.
    Внимание: удаляется последнее показание независимо от того, кто его внёс —
    оно могло прийти от управляющей компании.
  fields:
    entry_id:
      name: ID записи
      description: >-
        Идентификатор config entry. Можно не указывать, если интеграция настроена
        для одной квартиры.
      required: false
      example: 01JABCDEF0123456789
      selector:
        text:
